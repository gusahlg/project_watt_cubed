version = 1

# Project-owned software, build metadata, launchers, and development tooling.
[[annotations]]
path = [
  ".gitignore",
  ".github/**",
  "Cargo.lock",
  "Cargo.toml",
  "crates/**",
  "examples/**",
  "deny.toml",
  "flake.lock",
  "flake.nix",
  "play.sh",
  "scripts/**",
  "src/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Project Watt Cubed contributors <https://github.com/gusahlg/project_watt_cubed/blob/main/CONTRIBUTORS.md>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Project-owned prose and creative content. Substantial source-code snippets
# carry their own AGPL SPDX snippet markers inside the document.
[[annotations]]
path = [
  "README.md",
  "assets/attribution/**",
  "assets/music/README.md",
  "assets/sounds/README.md",
  "assets/sounds/catalog.toml",
  "documentation/**",
  "guides/*.md",
  "guides/reaction-guide/*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Project Watt Cubed contributors <https://github.com/gusahlg/project_watt_cubed/blob/main/CONTRIBUTORS.md>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The example modules are templates for new modules: like the first-party modules they are
# dual licensed Apache-2.0 OR MIT (MODULE_POLICY.md). This table must stay after the
# tables above, because the last matching table wins.
[[annotations]]
path = "examples/modules/*/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Project Watt Cubed contributors <https://github.com/gusahlg/project_watt_cubed/blob/main/CONTRIBUTORS.md>"
SPDX-License-Identifier = "Apache-2.0 OR MIT"
