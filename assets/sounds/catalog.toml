# Short, eagerly decoded sound effects. Relative paths are confined below this
# directory and duplicate file references are decoded only once.

[cues.break_default]
response = "world"
[[cues.break_default.layers]]
variants = ["generated/break_default_1.wav", "generated/break_default_2.wav"]
gain = [0.78, 0.95]
pitch = [-2.0, 2.0]
delay = [0.0]
mode = "one_shot"

