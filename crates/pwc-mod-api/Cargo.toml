[package]
name = "pwc-mod-api"
# The mod API version. Mods declare `pwc-api = "^1.0"` in mod.toml; the PWC package manager
# checks that requirement against this version. Bump the major version for any breaking change
# to what this crate re-exports.
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "The interface PWC mods compile against: the mod trait, the registrar and the mod-facing parts of the game."
publish = false

[dependencies]
project_watt_cubed = { path = "../.." }
