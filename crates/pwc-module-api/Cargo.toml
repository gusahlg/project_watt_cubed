[package]
name = "pwc-module-api"
# The module API version. Modules declare `pwc-api = "^3.4"` in module.toml; the PWC package manager
# checks that requirement against this version. A break old modules cannot compile through needs a
# major bump. 3.0 is mods-v3: no switches, one options registry, screens, the frame hook, messages
# and HUD facts (the changelog is at the top of src/lib.rs).
version = "3.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "The interface PWC modules compile against: the module trait, the registrar and the module-facing parts of the game."
publish = false

[dependencies]
project_watt_cubed = { path = "../.." }
